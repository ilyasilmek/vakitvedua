name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıklar
        run: npm install

      - name: Web dosyaları
        run: npm run build

      - name: Android projesi
        run: npx cap add android

      - name: Uygulama ikonu
        run: npx capacitor-assets generate --android --iconBackgroundColor '#2A9D8F' --splashBackgroundColor '#F2F8F8'

      - name: Bildirim ikonu ve izinler
        run: |
          cp android-res/drawable/*.xml android/app/src/main/res/drawable/
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Senkronizasyon
        run: npx cap sync android

      - name: APK derle
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: vakitvedua-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
