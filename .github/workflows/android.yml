name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıklar
        run: npm install

      - name: Web dosyaları
        run: npm run build

      - name: Android projesi
        run: npx cap add android

      - name: Uygulama ikonu
        run: npx capacitor-assets generate --android --iconBackgroundColor '#2A9D8F' --splashBackgroundColor '#F2F8F8'

      - name: Android kaynakları, widget, izinler ve AdMob
        run: |
          for d in drawable layout values xml raw; do mkdir -p android/app/src/main/res/$d; cp android-res/$d/* android/app/src/main/res/$d/; done
          cp android-res/java/*.java android/app/src/main/java/com/stitchilyas/vakitvedua/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n</manifest>#' $M
          sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-4494482100556023~2278665585" />\n        <receiver android:name=".VakitWidget" android:exported="true" android:label="Günün vakitleri">\n            <intent-filter>\n                <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n                <action android:name="android.intent.action.BOOT_COMPLETED" />\n                <action android:name="android.intent.action.TIME_SET" />\n                <action android:name="android.intent.action.TIMEZONE_CHANGED" />\n            </intent-filter>\n            <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_vakit_info" />\n        </receiver>\n        <receiver android:name=".VakitWidgetSmall" android:exported="true" android:label="Sıradaki vakit">\n            <intent-filter>\n                <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n            </intent-filter>\n            <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_small_info" />\n        </receiver>\n    </application>#' $M
          grep -q 'ads.APPLICATION_ID' $M && grep -q 'VakitWidget' $M

      - name: Sürüm
        run: |
          V=$(node -p "require('./package.json').version")
          C=$(echo "$V" | tr -d '.' | sed 's/^0*//')
          sed -i -E "s/versionCode [0-9]+/versionCode $C/; s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          grep -E 'applicationId|versionCode|versionName' android/app/build.gradle

      - name: Senkronizasyon
        run: npx cap sync android

      - name: APK ve AAB derle
        working-directory: android
        run: ./gradlew assembleDebug bundleRelease

      # Play Store'a yüklenecek AAB, yükleme anahtarıyla imzalanır.
      # Gerekli sırlar: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: AAB imzala
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if [ -z "$KS_B64" ]; then
            echo "::warning::İmza anahtarı sırları tanımlı değil; AAB imzasız. Play Console'a yüklemeden önce imzalanmalı."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > upload.jks
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload.jks -storepass "$KS_PASS" -keypass "${KEY_PASS:-$KS_PASS}" "$AAB" "$KEY_ALIAS"
          jarsigner -verify "$AAB" | tail -1
          rm upload.jks

      - uses: actions/upload-artifact@v4
        with:
          name: vakitvedua-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vakitvedua-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
