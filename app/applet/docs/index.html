<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vakit ve Dua - Namaz Vakitleri & İbadet Rehberi</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0F3832;
            color: #FFFFFF;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            color: #FFD700;
            margin-bottom: 0.5rem;
            font-size: 2.2rem;
        }
        p {
            color: #E0F2F1;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .btn {
            display: inline-block;
            background-color: #FFD700;
            color: #000000;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #B2DFDB;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🕌 Vakit ve Dua</h1>
        <p>Namaz vakitleri, Kıble pusulası, Zikirmatik, Kur'an-ı Kerim ve dualarla ibadet hayatınızı kolaylaştırın.</p>
        <a href="gizlilik.html" class="btn">Gizlilik Politikası</a>
        <div class="footer">
            <p>&copy; Stitchİlyas - Tüm Hakları Saklıdır.</p>
        </div>
    </div>
